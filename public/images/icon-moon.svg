<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <mask id="moonMask">
      <rect width="100" height="100" fill="white"/>
      <circle cx="63" cy="38" r="27" fill="black"/>
    </mask>
    <radialGradient id="moonGlow" cx="40%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Soft glow around moon -->
  <circle cx="45" cy="54" r="38" fill="url(#moonGlow)"/>
  <!-- Crescent moon -->
  <circle cx="45" cy="54" r="29" fill="#FDE68A" mask="url(#moonMask)"/>
  <!-- Stars -->
  <circle cx="83" cy="22" r="2.4" fill="#FDE68A" opacity="0.9"/>
  <circle cx="76" cy="11" r="1.7" fill="#FDE68A" opacity="0.7"/>
  <circle cx="90" cy="36" r="1.5" fill="#FDE68A" opacity="0.75"/>
  <circle cx="19" cy="18" r="1.8" fill="#FDE68A" opacity="0.7"/>
  <circle cx="13" cy="33" r="1.2" fill="#FDE68A" opacity="0.5"/>
  <circle cx="88" cy="60" r="1.3" fill="#FDE68A" opacity="0.5"/>
</svg>
